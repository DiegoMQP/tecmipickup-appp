spring.application.name=cafeteria-api
server.port=${PORT:8080}

spring.config.import=optional:dotenv:.env

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/tecmiratti}
spring.data.mongodb.database=${MONGODB_DATABASE:tecmiratti}
spring.data.mongodb.auto-index-creation=true

mongodb.pool.max-size=${MONGODB_POOL_MAX_SIZE:50}
mongodb.pool.min-size=${MONGODB_POOL_MIN_SIZE:5}
mongodb.pool.max-wait-ms=${MONGODB_POOL_MAX_WAIT_MS:10000}
mongodb.pool.max-idle-ms=${MONGODB_POOL_MAX_IDLE_MS:60000}
mongodb.pool.max-life-ms=${MONGODB_POOL_MAX_LIFE_MS:300000}
mongodb.pool.connect-timeout-ms=${MONGODB_CONNECT_TIMEOUT_MS:10000}
mongodb.pool.socket-timeout-ms=${MONGODB_SOCKET_TIMEOUT_MS:15000}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.admin.email=${TECMIPICKUP_ADMIN_EMAIL:}
app.admin.password=${TECMIPICKUP_ADMIN_PASSWORD:}

spring.jackson.time-zone=America/Mexico_City
logging.level.org.mongodb.driver=INFO

app.cors.origins=${APP_CORS_ORIGINS:https://tecmipickup-appp.vercel.app,http://localhost:5173,http://localhost:3000}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=45s
